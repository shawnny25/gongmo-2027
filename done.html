<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>접수 완료 — {{title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="nav">
  <div class="container">
    <a class="brand" href="index.html"><span class="mark">G</span><span data-content="orgName">ㅇㅇㅇ</span></a>
  </div>
</header>

<div class="done">
  <div class="glow tr"></div>
  <div class="glow bl"></div>
  <div class="container">
    <div class="check fade-up"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
    <h1 class="fade-up" data-delay="1" style="font-size:clamp(2.5rem,7vw,5rem)">접수<em>되었습니다</em></h1>
    <p class="muted fade-up" data-delay="2" style="margin-top:1rem">지원서가 정상적으로 접수되었습니다. 결과는 개별 연락드립니다.</p>
    <dl class="summary fade-up" id="summary" data-delay="2">
      <dt>이름</dt><dd data-name></dd>
      <dt>사업 기관명</dt><dd data-org></dd>
      <dt>사업 유형</dt><dd data-track></dd>
    </dl>
    <div class="fade-up" data-delay="3"><a class="btn btn-ghost" href="index.html">안내로 돌아가기</a></div>
  </div>
</div>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
